<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<body>
<!--
  In-app Claude help assistant widget. Included just before </body> on every signed-in page:
      <div th:replace="~{fragments/assistant-widget :: widget}"></div>
  Renders nothing when the user is anonymous or when the assistant is disabled
  (no ANTHROPIC_API_KEY), so the include is safe on any page. Self-contained CSS: it does
  not depend on Bootstrap because not every page loads it.
-->
<th:block th:fragment="widget" sec:authorize="isAuthenticated()" th:if="${@assistantService.isEnabled()}">
    <style>
        #snaToggle {
            position: fixed; right: 20px; bottom: 20px; z-index: 1040;
            display: inline-flex; align-items: center; gap: 8px;
            padding: 10px 16px; border: 0; border-radius: 999px; cursor: pointer;
            background: #2c3e50; color: #fff; font: 600 15px/1 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            box-shadow: 0 6px 18px rgba(0,0,0,.22);
        }
        #snaToggle:hover { background: #3498db; }
        #snaToggle:focus-visible { outline: 3px solid #3498db; outline-offset: 2px; }
        #snaToggle svg { width: 18px; height: 18px; fill: currentColor; }

        #snaPanel {
            position: fixed; right: 20px; bottom: 80px; z-index: 1040;
            width: 380px; max-width: calc(100vw - 40px); height: 560px; max-height: calc(100vh - 110px);
            display: flex; flex-direction: column; overflow: hidden;
            background: #fff; color: #2c3e50; border-radius: 14px;
            box-shadow: 0 12px 36px rgba(0,0,0,.28);
            font: 14px/1.5 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        #snaPanel[hidden] { display: none; }
        .sna-head {
            display: flex; align-items: center; gap: 10px; padding: 12px 14px;
            background: #2c3e50; color: #fff;
        }
        .sna-head h2 { margin: 0; font-size: 15px; font-weight: 600; flex: 1; }
        .sna-head small { display: block; font-weight: 400; opacity: .8; font-size: 12px; }
        .sna-head button {
            border: 0; background: transparent; color: #fff; cursor: pointer; font-size: 13px;
            padding: 4px 8px; border-radius: 6px; opacity: .85;
        }
        .sna-head button:hover { background: rgba(255,255,255,.15); opacity: 1; }
        .sna-log { flex: 1; overflow-y: auto; padding: 14px; background: #f5f7f9; }
        .sna-msg { max-width: 92%; margin: 0 0 10px; padding: 9px 12px; border-radius: 12px; white-space: normal; word-wrap: break-word; }
        .sna-msg.user { margin-left: auto; background: #3498db; color: #fff; border-bottom-right-radius: 4px; white-space: pre-wrap; }
        .sna-msg.assistant { margin-right: auto; background: #fff; border: 1px solid #e1e6ea; border-bottom-left-radius: 4px; }
        .sna-msg.error { margin-right: auto; background: #fdecea; border: 1px solid #f5c2c0; color: #8a1f1b; }
        .sna-msg p { margin: 0 0 8px; }
        .sna-msg p:last-child { margin-bottom: 0; }
        .sna-msg ul, .sna-msg ol { margin: 4px 0 8px 20px; padding: 0; }
        .sna-msg li { margin: 2px 0; }
        .sna-msg code { background: #eef1f4; padding: 1px 5px; border-radius: 4px; font-size: 13px; }
        .sna-msg a { color: #2471a3; text-decoration: underline; }
        .sna-msg.user a { color: #fff; }
        .sna-typing span { display: inline-block; width: 6px; height: 6px; margin-right: 3px; border-radius: 50%; background: #95a5a6; animation: snaBlink 1.2s infinite; }
        .sna-typing span:nth-child(2) { animation-delay: .2s; }
        .sna-typing span:nth-child(3) { animation-delay: .4s; }
        @keyframes snaBlink { 0%, 80%, 100% { opacity: .2; } 40% { opacity: 1; } }
        .sna-chips { display: flex; flex-wrap: wrap; gap: 6px; margin: 4px 0 10px; }
        .sna-chips button {
            border: 1px solid #bdc3c7; background: #fff; color: #2c3e50; border-radius: 999px;
            padding: 5px 10px; font-size: 12px; cursor: pointer;
        }
        .sna-chips button:hover { border-color: #3498db; color: #3498db; }
        .sna-form { display: flex; gap: 8px; padding: 10px; border-top: 1px solid #e1e6ea; background: #fff; }
        .sna-form textarea {
            flex: 1; resize: none; min-height: 40px; max-height: 120px; padding: 8px 10px;
            border: 1px solid #bdc3c7; border-radius: 8px; font: inherit; color: inherit;
        }
        .sna-form textarea:focus { outline: 2px solid #3498db; border-color: #3498db; }
        .sna-form button {
            border: 0; border-radius: 8px; padding: 0 14px; background: #2c3e50; color: #fff;
            font-weight: 600; cursor: pointer;
        }
        .sna-form button:disabled { opacity: .5; cursor: default; }
        .sna-foot { padding: 4px 12px 8px; font-size: 11px; color: #7f8c8d; background: #fff; }
        @media (max-width: 480px) {
            #snaPanel { right: 0; bottom: 0; width: 100vw; max-width: 100vw; height: 100vh; max-height: 100vh; border-radius: 0; }
            #snaToggle { right: 12px; bottom: 12px; }
        }
    </style>

    <!-- CSRF token rendered server-side, the same way the app's forms do it. The widget sends
         it back in the header Spring Security names here. Rendering it also guarantees the
         CSRF cookie is written on every page that carries the widget. -->
    <div id="snaConfig" hidden
         th:data-csrf-header="${_csrf != null ? _csrf.headerName : ''}"
         th:data-csrf-token="${_csrf != null ? _csrf.token : ''}"></div>

    <button id="snaToggle" type="button" aria-controls="snaPanel" aria-expanded="false" title="Ask the help assistant">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2a10 10 0 0 0-8.6 15.1L2 22l4.9-1.4A10 10 0 1 0 12 2zm0 18a8 8 0 0 1-4.1-1.1l-.3-.2-2.9.8.8-2.8-.2-.3A8 8 0 1 1 12 20zm-1-5h2v2h-2zm2.5-3.6c-.4.3-.5.5-.5 1.1h-2c0-1.3.4-1.9 1.2-2.5.6-.4.8-.6.8-1.1 0-.6-.4-1-1-1s-1 .5-1 1.2H9c0-1.9 1.3-3.1 3-3.1 1.8 0 3 1.1 3 2.7 0 1.1-.5 1.7-1.5 2.7z"/></svg>
        <span>Help</span>
    </button>

    <section id="snaPanel" hidden role="dialog" aria-modal="false" aria-labelledby="snaTitle">
        <div class="sna-head">
            <h2 id="snaTitle">Help assistant<small>Ask how to do something in SafelyNested</small></h2>
            <button type="button" id="snaClear" title="Start a new conversation">Clear</button>
            <button type="button" id="snaClose" aria-label="Close help assistant">&#x2715;</button>
        </div>
        <div class="sna-log" id="snaLog" aria-live="polite"></div>
        <form class="sna-form" id="snaForm" autocomplete="off">
            <textarea id="snaInput" rows="1" placeholder="Type a question…" aria-label="Your question" maxlength="2000"></textarea>
            <button type="submit" id="snaSend">Send</button>
        </form>
        <div class="sna-foot">Answers are generated and may be imperfect. Don't enter personal details about families.</div>
    </section>

    <script th:src="@{/js/assistant.js}" defer></script>
</th:block>
</body>
</html>
