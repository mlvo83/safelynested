<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Change Password - SafelyNested</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif;
               background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); min-height: 100vh;
               display: flex; align-items: center; justify-content: center; padding: 20px; }
        .card { background: white; padding: 36px 40px; border-radius: 14px;
                box-shadow: 0 12px 40px rgba(0,0,0,0.25); width: 100%; max-width: 440px; }
        h1 { font-size: 22px; color: #333; margin-bottom: 6px; }
        .sub { color: #666; font-size: 14px; margin-bottom: 24px; line-height: 1.5; }
        label { display: block; font-weight: 600; color: #333; margin-bottom: 6px; font-size: 14px; }
        input[type=password] { width: 100%; padding: 12px; border: 1px solid #ddd; border-radius: 8px;
                               font-size: 14px; margin-bottom: 6px; }
        input:focus { outline: none; border-color: #667eea; }
        .hint { color: #888; font-size: 12px; margin-bottom: 18px; }
        .btn { width: 100%; padding: 13px; border: none; border-radius: 8px;
               background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: white;
               font-size: 15px; font-weight: 600; cursor: pointer; margin-top: 6px; }
        .btn:hover { filter: brightness(1.06); }
        .alert { background: #f8d7da; color: #721c24; border: 1px solid #f5c6cb; padding: 12px;
                 border-radius: 8px; margin-bottom: 18px; font-size: 14px; }
    </style>
</head>
<body>
    <div class="card">
        <h1>Change your password</h1>
        <p class="sub" th:if="${forced}">For your security, please set a new password before continuing —
            your current one was issued as a temporary password.</p>
        <p class="sub" th:unless="${forced}">Set a new password for your account.</p>

        <div th:if="${error}" class="alert" th:text="${error}">Error</div>

        <form th:action="@{/change-password}" method="post" onsubmit="return validateMatch()">
            <label for="newPassword">New password</label>
            <input type="password" id="newPassword" name="newPassword" required minlength="8" autocomplete="new-password">
            <div class="hint">At least 8 characters.</div>

            <label for="confirmPassword">Confirm new password</label>
            <input type="password" id="confirmPassword" name="confirmPassword" required minlength="8" autocomplete="new-password">
            <div class="hint">&nbsp;</div>

            <button type="submit" class="btn">Update password</button>
        </form>
    </div>
    <script>
        function validateMatch() {
            var p = document.getElementById('newPassword').value;
            var c = document.getElementById('confirmPassword').value;
            if (p !== c) { alert('Passwords do not match.'); return false; }
            return true;
        }
    </script>
</body>
</html>
