spring.profiles.active=local

# Session tracking: cookies only (never URL rewriting like ;jsessionid=...)
# Spring Security's StrictHttpFirewall rejects any URL containing ';' as a
# potentially malicious path-parameter injection. URL rewriting is disabled
# by default in Spring Boot 3+ but we set this explicitly so an upstream
# misconfiguration can't re-enable it.
server.servlet.session.tracking-modes=cookie

# Public application forms (charity / stay-partner) are long to fill out. Give
# people well over the 30-minute default before the session  and anything tied
# to it  lapses. Paired with cookie-based CSRF (see SecurityConfig) so a submit
# still works even if the session does expire.
server.servlet.session.timeout=120m

# Recipients for "new charity application" notifications. Comma-separated. When
# blank, every enabled ADMIN user's email on file is notified instead. Set the
# ADMIN_NOTIFICATION_EMAIL environment variable in prod to pin it to a shared inbox.
app.admin-notification-email=${ADMIN_NOTIFICATION_EMAIL:}

# Document upload limits match the "Max 10MB" message shown on the
# upload form. Spring Boot defaults are only 1MB which makes the form
# silently reject most real PDFs.
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# Cloudflare Turnstile CAPTCHA for the public charity application form.
# Both keys must be set to turn the CAPTCHA on; when blank it is skipped and
# the form still works (honeypot, time-trap, rate limiting, and server-side
# content validation remain active regardless).
# Get keys at https://dash.cloudflare.com/?to=/:account/turnstile and set them
# as environment variables TURNSTILE_SITE_KEY / TURNSTILE_SECRET_KEY.
app.turnstile.site-key=${TURNSTILE_SITE_KEY:}
app.turnstile.secret-key=${TURNSTILE_SECRET_KEY:}
# ---------------------------------------------------------------------------
# In-app Claude help assistant (AssistantService / AssistantController)
# Phase 1: read-only "how do I use the app" help for signed-in users.
# The whole feature is OFF until ANTHROPIC_API_KEY is set (one server-side key
# from the SafelyNested Anthropic Console account; end users never see it).
# Set it as an environment variable (Render env / IntelliJ run config). Never
# commit it to a properties file.
# ---------------------------------------------------------------------------
app.assistant.api-key=${ANTHROPIC_API_KEY:}
# Only for an ORGANIZATION-level key: the Console workspace to bill (wrkspc_...). A
# workspace-scoped key (recommended) needs this left blank; sending it then is an error.
app.assistant.workspace-id=${ANTHROPIC_WORKSPACE_ID:}
# Model id. Opus 5.5 by default. Set ASSISTANT_MODEL=claude-sonnet-5-5 or
# claude-haiku-4-5 to trade some quality for cost.
app.assistant.model=${ASSISTANT_MODEL:claude-opus-5-5}
# Thinking effort (low | medium | high). "low" is right for a help chat.
# Ignored automatically for Haiku 4.5, which does not accept the parameter.
app.assistant.effort=${ASSISTANT_EFFORT:low}
# Hard cap on tokens generated per reply (thinking + answer).
app.assistant.max-output-tokens=2048
# Longest question a user may send, in characters.
app.assistant.max-message-chars=2000
# How many prior turns of the chat are replayed to the model.
app.assistant.max-history-messages=20
# Per-user rate limits (in-memory, per app instance).
app.assistant.per-minute-limit=10
app.assistant.per-day-limit=150
# Seconds to wait for the model before giving up.
app.assistant.timeout-seconds=90
# Also feed the model the public onboarding guides served under /help/.
app.assistant.include-onboarding-docs=true
